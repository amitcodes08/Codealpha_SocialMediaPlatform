<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — Pulse</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div>
        <a href="/" class="brand">
          <div class="brand-icon">⚡</div>
          <span>Pulse</span>
        </a>

        <ul class="nav-menu">
          <li class="nav-item">
            <a href="/">
              <span class="nav-icon">🏠</span>
              <span>Home Feed</span>
            </a>
          </li>
          <li class="nav-item active">
            <a href="/profile.html" class="my-profile-link">
              <span class="nav-icon">👤</span>
              <span>My Profile</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="javascript:void(0)" onclick="Auth.showModal()">
              <span class="nav-icon">⇄</span>
              <span>Switch User</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="user-badge-container" id="sidebarUserBadge"></div>
    </aside>

    <!-- CENTER MAIN CONTENT -->
    <main class="main-content">
      <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
        <a href="/" class="btn btn-secondary btn-sm" style="border-radius: 50%; width: 36px; height: 36px; padding: 0;">←</a>
        <h2 style="font-size: 1.3rem; font-weight: 800;">Profile</h2>
      </div>

      <!-- Profile Header Area -->
      <div id="profileHeaderContainer">
        <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
          Loading user profile...
        </div>
      </div>

      <!-- User's Posts Feed Header -->
      <div style="font-size: 1.15rem; font-weight: 800; margin-bottom: 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">
        Posts
      </div>

      <div id="profilePostsList"></div>
    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="right-sidebar">
      <div class="widget-card">
        <h3 class="widget-title">Explore Creators</h3>
        <div id="suggestedUsersList">
          <div style="color: var(--text-muted); font-size: 0.85rem;">Finding interesting creators...</div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Edit Profile Modal -->
  <div id="editProfileModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size: 1.25rem; font-weight: 800;">Edit Profile</h3>
        <button class="close-btn" id="closeEditProfileModal">&times;</button>
      </div>

      <form id="editProfileForm">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" class="form-control" id="editName" required>
        </div>
        <div class="form-group">
          <label>Bio</label>
          <textarea class="form-control" id="editBio" rows="3" placeholder="Tell the world what you do..."></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Location</label>
            <input type="text" class="form-control" id="editLocation" placeholder="e.g. New York, NY">
          </div>
          <div class="form-group">
            <label>Website URL</label>
            <input type="url" class="form-control" id="editWebsite" placeholder="https://example.com">
          </div>
        </div>
        <div class="form-group">
          <label>Avatar Image URL</label>
          <input type="url" class="form-control" id="editAvatarUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Cover Photo URL</label>
          <input type="url" class="form-control" id="editCoverUrl" placeholder="https://...">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
          Save Profile Changes
        </button>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Profile.init();
      App.loadSuggestedUsers();
    });
  </script>
</body>
</html>
